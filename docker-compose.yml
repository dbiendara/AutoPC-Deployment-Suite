services:
  fdim:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fdim-app
    restart: unless-stopped
    environment:
      - PORT=3000
      - NODE_ENV=production
    volumes:
      - ./data:/app/data
    networks:
      - fdim-net
    expose:
      - "3000"

  nginx:
    image: nginx:alpine
    container_name: fdim-nginx-ssl
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - fdim
    networks:
      - fdim-net

networks:
  fdim-net:
    driver: bridge
